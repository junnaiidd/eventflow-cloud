# Used by the automated tests (@ActiveProfiles("test")). Overlays the default (local / H2) configuration.
spring.datasource.url=jdbc:h2:mem:eventflow-test;DB_CLOSE_DELAY=-1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
logging.level.com.example.eventflow=WARN
logging.level.org.hibernate.SQL=WARN

# tests create their own data
app.seed.enabled=false
app.seed.demo-accounts=false
app.storage.type=local
app.storage.local-dir=${java.io.tmpdir}/eventflow-test-uploads
