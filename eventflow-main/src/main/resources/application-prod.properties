# ===========================================================================
# EventFlow - PRODUCTION profile (AWS EC2 + RDS MySQL + S3)
# Activate with:  SPRING_PROFILES_ACTIVE=prod
# Nothing secret is stored in this file: every credential comes from an environment variable.
# A missing required variable stops the application at start-up with a clear error.
# ===========================================================================

server.port=${PORT:8080}
# The app normally sits behind nginx / a load balancer that terminates HTTPS
server.forward-headers-strategy=framework

# ---- Database: AWS RDS for MySQL -------------------------------------------
# Required: DB_HOST (RDS endpoint), DB_NAME, DB_USERNAME, DB_PASSWORD.  Optional: DB_PORT, DB_SSL_MODE.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# "update" only ADDS missing tables/columns; it never drops or rewrites data. Use "validate" together with
# docs/migration-mysql.sql if you prefer to apply schema changes by hand.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

# ---- No sample data / demo accounts in production --------------------------
app.seed.enabled=false
app.seed.demo-accounts=false
# First administrator (created only if the e-mail does not exist yet)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---- File storage: Amazon S3 (private bucket) -------------------------------
# Required: S3_BUCKET, AWS_REGION. AWS credentials are NOT configured here: the SDK finds them itself
# (EC2 instance role - recommended - or AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY environment variables).
app.storage.type=s3
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.region=${AWS_REGION}

# ---- Sessions: set COOKIE_SECURE=true once the site is served over HTTPS -----
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Logging ---------------------------------------------------------------
logging.level.com.example.eventflow=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{20} - %msg%n
