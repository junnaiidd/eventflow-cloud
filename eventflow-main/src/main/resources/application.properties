# Server Configuration
server.port=8080

# Application Configuration
spring.application.name=EventFlow

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:eventflowdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.example.eventflow=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Currency Configuration
app.currency.symbol=₹
app.currency.code=INR

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
# ---------------------------------------------------------------------------
# EventFlow features (local development defaults - no AWS needed)
# ---------------------------------------------------------------------------
# Sample events and demo logins (admin@eventflow.local / Admin@123, organizer@eventflow.local / Organizer@123,
# participant accounts such as aarav@eventflow.local / Participant@123). Disabled in the "prod" profile.
app.seed.enabled=true
app.seed.demo-accounts=true

# File storage for event posters and certificate PDFs: "local" (folder on disk) or "s3" (Amazon S3, prod profile)
app.storage.type=local
app.storage.local-dir=./uploads
app.upload.max-bytes=2097152
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Name printed on certificates when the event has no organizer
app.organization.name=EventFlow

# Optional: creates this admin at start-up if the e-mail does not exist yet (used in production)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Sessions
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Health probe only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
